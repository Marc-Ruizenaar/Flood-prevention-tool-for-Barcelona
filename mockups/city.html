<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>City view mockups</title>
<style>
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; background: #111; }
  #map { position: absolute; inset: 0; }
  nav { position: absolute; top: 12px; left: 12px; z-index: 2; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 24px); }
  nav button { border: 0; border-radius: 999px; padding: 8px 14px; background: #f5f1e8; color: #1c1917; cursor: pointer; font: inherit; }
  nav button.on { background: #1c1917; color: #f5f1e8; outline: 2px solid #f5f1e8; }
  #note { position: absolute; left: 12px; bottom: 28px; z-index: 2; max-width: 360px; padding: 12px 14px; border-radius: 12px; background: rgba(20,24,28,.88); color: #f5f1e8; }
  #note b { display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="map"></div>
<nav id="tabs"></nav>
<div id="note"></div>
<script type="module">
// ponytail: throwaway mockup page, not wired into the app. Delete once a direction is picked.
import maplibregl from "maplibre-gl";
import "maplibre-gl/dist/maplibre-gl.css";

const files = ["sewer-t10-stress", "resccue-hotspots", "slopes-torrents", "buried-streams", "retention-tanks"];
const [sewers, hotspots, slopes, streams, tanks] = await Promise.all(
  files.map((f) => fetch(`/data/geojson/${f}.geojson`).then((r) => r.json())),
);

// Hotspots as small square footprints so they can be extruded into columns.
const columns = {
  type: "FeatureCollection",
  features: hotspots.features.map((f) => {
    const [x, y] = f.geometry.coordinates, d = 0.00016;
    return { ...f, geometry: { type: "Polygon", coordinates: [[[x-d,y-d],[x+d,y-d],[x+d,y+d],[x-d,y+d],[x-d,y-d]]] } };
  }),
};
const sewerShape = { type: "MultiPolygon", coordinates: sewers.features.map((f) => f.geometry.coordinates) };

const MOCKS = {
  blocks: {
    label: "A · 3D blocks",
    note: "<b>Buildings up, terrain out.</b> Eixample is a grid of 20 m blocks, so height is the texture. Sewer-stress zones glow in the streets between buildings, where the water actually runs. Hotspots stand as red columns you can spot from across the city.",
    style: "https://tiles.openfreemap.org/styles/positron",
    view: { center: [2.163, 41.392], zoom: 14.6, pitch: 58, bearing: -44 },
    add(map) {
      map.addSource("sewers", { type: "geojson", data: sewers });
      map.addSource("cols", { type: "geojson", data: columns });
      map.addLayer({ id: "sewer-glow", type: "fill", source: "sewers", paint: { "fill-color": "#fdba74", "fill-opacity": 0.35 } }, "building");
      map.addLayer({
        id: "wet-streets", type: "line", source: "openmaptiles", "source-layer": "transportation",
        filter: ["within", sewerShape],
        layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": "#ea580c", "line-width": ["interpolate", ["linear"], ["zoom"], 13, 2, 16, 14], "line-opacity": 0.9 },
      });
      map.addLayer({
        id: "bldg-3d", type: "fill-extrusion", source: "openmaptiles", "source-layer": "building", minzoom: 13,
        paint: {
          "fill-extrusion-color": "#f4f1ea",
          "fill-extrusion-height": ["coalesce", ["get", "render_height"], 12],
          "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], 0],
          "fill-extrusion-opacity": 0.92,
        },
      });
      map.addLayer({ id: "cols", type: "fill-extrusion", source: "cols", paint: { "fill-extrusion-color": "#b42318", "fill-extrusion-height": 260, "fill-extrusion-opacity": 0.9 } });
    },
  },
  streets: {
    label: "B · Streets carry water",
    note: "<b>Paint the street network, not blobs.</b> In a dense city water moves along streets. Streets inside a T10 stress zone turn blue and thicken by road class; the rest of the city fades back. Buried rieres flow downhill toward the sea, which says more about slope here than a hillshade does.",
    style: "https://tiles.openfreemap.org/styles/positron",
    view: { center: [2.168, 41.398], zoom: 13.6, pitch: 0, bearing: 0 },
    add(map) {
      map.addSource("streams", { type: "geojson", data: streams });
      const width = ["match", ["get", "class"], ["primary", "trunk", "motorway"], 5, ["secondary", "tertiary"], 3.5, 2];
      map.addLayer({
        id: "wet-streets", type: "line", source: "openmaptiles", "source-layer": "transportation",
        filter: ["within", sewerShape],
        layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": "#1d6fd8", "line-width": ["interpolate", ["linear"], ["zoom"], 12, ["*", width, 0.4], 16, ["*", width, 2]], "line-opacity": 0.85 },
      });
      map.addLayer({
        id: "stream-flow", type: "line", source: "streams",
        layout: { "line-cap": "round" },
        paint: { "line-color": "#0e7490", "line-width": 2.2, "line-dasharray": [0, 4, 3] },
      });
      return dashAnimation(map, "stream-flow");
    },
  },
  night: {
    label: "C · Flow at night",
    note: "<b>Dark base, light is risk.</b> Only the things that matter glow: rieres pulse downhill, hotspots breathe, Collserola slopes sit in violet. Reads well on a projector and a phone in a dark room. Terrain is implied by where the light flows.",
    style: "https://tiles.openfreemap.org/styles/dark",
    view: { center: [2.17, 41.415], zoom: 12.4, pitch: 30, bearing: -20 },
    add(map) {
      map.addSource("streams", { type: "geojson", data: streams });
      map.addSource("hot", { type: "geojson", data: hotspots });
      map.addSource("slopes", { type: "geojson", data: slopes });
      map.addSource("sewers", { type: "geojson", data: sewers });
      map.addLayer({ id: "slope-glow", type: "fill", source: "slopes", paint: { "fill-color": "#8b5cf6", "fill-opacity": 0.28 } });
      map.addLayer({ id: "sewer-glow", type: "fill", source: "sewers", paint: { "fill-color": "#f97316", "fill-opacity": 0.18 } });
      map.addLayer({ id: "stream-halo", type: "line", source: "streams", paint: { "line-color": "#22d3ee", "line-width": 6, "line-blur": 6, "line-opacity": 0.35 } });
      map.addLayer({ id: "stream-flow", type: "line", source: "streams", layout: { "line-cap": "round" }, paint: { "line-color": "#a5f3fc", "line-width": 1.6, "line-dasharray": [0, 4, 3] } });
      map.addLayer({ id: "hot-pulse", type: "circle", source: "hot", paint: { "circle-color": "#f43f5e", "circle-radius": 10, "circle-opacity": 0.4, "circle-blur": 0.6 } });
      map.addLayer({ id: "hot-core", type: "circle", source: "hot", paint: { "circle-color": "#fecdd3", "circle-radius": 3.5 } });
      const stopDash = dashAnimation(map, "stream-flow");
      let raf;
      const pulse = (t) => {
        const k = (Math.sin(t / 400) + 1) / 2;
        if (map.getLayer("hot-pulse")) {
          map.setPaintProperty("hot-pulse", "circle-radius", 8 + 14 * k);
          map.setPaintProperty("hot-pulse", "circle-opacity", 0.5 - 0.35 * k);
        }
        raf = requestAnimationFrame(pulse);
      };
      raf = requestAnimationFrame(pulse);
      return () => { stopDash(); cancelAnimationFrame(raf); };
    },
  },
};

// Classic MapLibre "ant path": cycle through shifted dash patterns.
function dashAnimation(map, layer) {
  const seq = [[0,4,3],[0.5,4,2.5],[1,4,2],[1.5,4,1.5],[2,4,1],[2.5,4,0.5],[3,4,0],[0,0.5,3,3.5],[0,1,3,3],[0,1.5,3,2.5],[0,2,3,2],[0,2.5,3,1.5],[0,3,3,1],[0,3.5,3,0.5]];
  let i = 0;
  const id = setInterval(() => {
    if (!map.getLayer(layer)) return;
    map.setPaintProperty(layer, "line-dasharray", seq[i++ % seq.length]);
  }, 60);
  return () => clearInterval(id);
}

const first = MOCKS[location.hash.slice(1)] ? location.hash.slice(1) : "blocks";
const map = new maplibregl.Map({ container: "map", style: MOCKS[first].style, ...MOCKS[first].view, maxPitch: 70 });
map.addControl(new maplibregl.NavigationControl(), "top-right");
window.map = map;

let stop = () => {};
let current = first;
map.on("style.load", () => {
  const mock = MOCKS[current];
  map.jumpTo(mock.view);
  stop = mock.add(map) ?? (() => {});
});
function show(key) {
  if (key === current) return;
  const mock = MOCKS[key];
  stop();
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.key === key));
  document.getElementById("note").innerHTML = mock.note;
  history.replaceState(null, "", `#${key}`);
  current = key;
  map.setStyle(mock.style, { diff: false });
}

const tabs = document.getElementById("tabs");
for (const [key, mock] of Object.entries(MOCKS)) {
  const b = document.createElement("button");
  b.textContent = mock.label;
  b.dataset.key = key;
  b.onclick = () => show(key);
  tabs.append(b);
}
document.querySelector(`[data-key=${first}]`).classList.add("on");
document.getElementById("note").innerHTML = MOCKS[first].note;
</script>
</body>
</html>
