[project]
name = "bcnflood"
version = "0.1.0"
description = "Barcelona Flood Physics Engine - physics-based urban surface-water simulation (Milestone 1)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "pydantic>=2.6", "numpy>=1.26", "uvicorn>=0.29", "rasterio>=1.3", "pyproj>=3.6", "shapely>=2.0"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
bcnflood = ["../../manifests/*.json"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
