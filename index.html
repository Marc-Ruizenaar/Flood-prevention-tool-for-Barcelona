<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#142028" />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="preconnect" href="https://geoserveis.icgc.cat" crossorigin />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Published flood geography for Barcelona: sewers, buried streams, and slopes." />
    <link rel="preload" href="/fonts/fraunces-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/outfit-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/outfit-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Next rain — Barcelona</title>
    <script>
      // Same language pick as src/lib/i18n.ts, set before paint so the first frame already has the right lang.
      try {
        var l = localStorage.getItem("lang") || navigator.language;
        document.documentElement.lang = /^ca/i.test(l) ? "ca" : /^es/i.test(l) ? "es" : "en";
      } catch (e) {}
    </script>
  </head>
  <body style="background:#142028">
    <div id="root"></div>
    <script>
      // Offline support (see README). When a newer worker takes over, reload once so the open tab
      // shows the new build instead of the shell it loaded with. The flag stops a reload loop.
      if ("serviceWorker" in navigator) {
        // Only an update reloads. On a first visit the new worker also fires controllerchange when it
        // claims the page, and reloading then would restart every first visit a second in.
        var hadWorker = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (hadWorker && !window.__reloading) { window.__reloading = true; location.reload(); }
        });
        window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js", { scope: "/" }); });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
